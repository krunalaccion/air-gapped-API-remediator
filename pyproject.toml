[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-remediator"
version = "0.1.0"
description = "Autonomous Air-Gapped Security Scanner & Remediation Agent"
readme = "README.md"
authors = [{ name = "AirGap Remediator Developer" }]
requires-python = ">=3.9"
dependencies = [
    # Zero mandatory third-party dependencies required; operates cleanly with Python standard library!
    # Optional dependencies can be added for YAML/Pydantic/Requests if desired.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
extras = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
airgap-remediator = "agents.git_agent.cli:main"
airgapped-remediator = "agents.git_agent.cli:main"
airgap-agent = "agents.git_agent.cli:main"
airgap-mcp = "agents.git_agent.mcp_server:main"
airgap-server = "web_server:run_server"
git-agent = "agents.git_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "orchestrator*", "git_agent*"]

